name: Feature request
description: Suggest an improvement that fits the single-file philosophy.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        NOVA is deliberately a single self-contained HTML file with zero dependencies.
        Features that require a build step, a package, a server, or a network request are
        unlikely to be accepted. See [CONTRIBUTING.md](https://github.com/somphol/calculator/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the implementation.
      placeholder: I often need to..., but currently...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
      placeholder: Add a button that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other calculators, or simpler approaches.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Parser / math engine
        - Keyboard support
        - Memory or history
        - Accessibility
        - Visual design
        - Documentation
        - CI / deployment
        - Other

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This can be implemented inside the existing single HTML file.
          required: true
        - label: This does not require a network request or third-party dependency.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples from other calculators, or related issues.
